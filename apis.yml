aid: lap-coffee
name: LAP Coffee
description: 'LAP Coffee (Life Among People) is a Berlin-founded specialty coffee retail chain operated by
  Micro Retail Technologies MRT GmbH. It opened its first store in Berlin Mitte in August 2023 and has grown
  to a network of neighbourhood cafes across Berlin, with further locations and openings in Cologne, Frankfurt,
  Munich and Hamburg. LAP serves locally roasted specialty coffee at everyday prices from small, high-throughput
  stores, and runs a consumer mobile app (LAP: Everyday Coffee) for pre-ordering, in-store pickup, a stamps and
  rewards loyalty program, gifting and referrals, replacing an earlier Apple/Google Wallet stamp pass. LAP is
  backed by HV Capital. As of this enrichment pass LAP publishes no public developer program, API, SDK or
  developer documentation; its technology surface is the consumer app, the order.lap.coffee deep-link service
  and a Webflow marketing site.'
